manifestVersion: 1
id: find-my-hub
category: automation
name: Find My Hub
version: "1.1.18"
tagline: One map for Apple Find My and Google Find Hub trackers
description: >-
  A self-hosted multi-user tracking hub for personal Apple Find My and Google
  Find Hub compatible Bluetooth trackers, with history, reversible multi-device
  unified views, persistent history time ranges, isolated user accounts,
  reliable Google locations above an immutable raw archive, confidence and
  anti-teleport analysis, guarded key rotation, complete backups, optional MQTT/Home Assistant and
  Traccar, firmware tools and a configured ESP32 library. Illustrated EN/IT
  guides use synthetic images. Unofficial, not guaranteed live GPS tracking.
