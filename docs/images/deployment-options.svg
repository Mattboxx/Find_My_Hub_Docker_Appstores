<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
  <title id="title">Find My Hub: legacy modular stack versus recommended All-in-One</title>
  <desc id="desc">The legacy modular stack has separate web, Apple and Google containers plus upstream Anisette, four containers total. The recommended all-in-one image runs web, Apple and Google as three processes in one container, plus upstream Anisette, two containers total. Both provide the same interface and features.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#94a3b8"/></marker></defs>
  <rect width="1120" height="610" rx="20" fill="#0f172a"/>
  <g font-family="Arial, sans-serif" fill="#f8fafc">
    <text x="40" y="48" font-size="26" font-weight="700">Same features. Recommended and legacy layouts.</text>
    <text x="40" y="78" font-size="16" fill="#cbd5e1">All-in-One is recommended for new installations; existing modular deployments remain available.</text>
    <rect x="25" y="105" width="525" height="437" rx="16" fill="#18243b" stroke="#475569"/>
    <rect x="570" y="105" width="525" height="437" rx="16" fill="#18243b" stroke="#475569"/>
    <text x="48" y="140" font-size="22" font-weight="700">Legacy modular stack</text>
    <text x="48" y="170" font-size="17" fill="#93c5fd">3 Find My Hub containers + Anisette = 4</text>
    <rect x="80" y="196" width="410" height="65" rx="10" fill="#1e40af"/>
    <text x="285" y="222" text-anchor="middle" font-size="19">Web · map</text>
    <text x="285" y="246" text-anchor="middle" font-size="15" fill="#dbeafe">find-my-web</text>
    <path d="M180 261 V290 M390 261 V290" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="55" y="299" width="215" height="75" rx="10" fill="#334155" stroke="#64748b"/>
    <text x="162" y="328" text-anchor="middle" font-size="19">Apple provider</text>
    <text x="162" y="353" text-anchor="middle" font-size="14" fill="#cbd5e1">find-my-apple-provider</text>
    <rect x="290" y="299" width="235" height="75" rx="10" fill="#334155" stroke="#64748b"/>
    <text x="407" y="328" text-anchor="middle" font-size="19">Google provider</text>
    <text x="407" y="353" text-anchor="middle" font-size="14" fill="#cbd5e1">find-my-google-provider</text>
    <path d="M162 374 V403" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="55" y="412" width="215" height="60" rx="10" fill="#374151" stroke="#94a3b8"/>
    <text x="162" y="438" text-anchor="middle" font-size="18">Anisette upstream</text>
    <text x="162" y="460" text-anchor="middle" font-size="14" fill="#cbd5e1">separate</text>
    <text x="48" y="515" font-size="15" fill="#cbd5e1">Existing native-store layout · legacy</text>
    <text x="594" y="140" font-size="22" font-weight="700">Recommended All-in-One</text>
    <text x="594" y="170" font-size="17" fill="#86efac">1 Find My Hub container + Anisette = 2</text>
    <rect x="600" y="196" width="465" height="190" rx="12" fill="#103d39" stroke="#34d399" stroke-width="2"/>
    <text x="832" y="229" text-anchor="middle" font-size="21" font-weight="700">apple-google-tracking-server</text>
    <text x="832" y="258" text-anchor="middle" font-size="15" fill="#bbf7d0">ONE container</text>
    <rect x="620" y="280" width="126" height="70" rx="8" fill="#1e40af"/>
    <rect x="766" y="280" width="126" height="70" rx="8" fill="#334155"/>
    <rect x="912" y="280" width="133" height="70" rx="8" fill="#334155"/>
    <text x="683" y="320" text-anchor="middle" font-size="18">Web</text>
    <text x="829" y="320" text-anchor="middle" font-size="18">Apple</text>
    <text x="978" y="320" text-anchor="middle" font-size="18">Google</text>
    <path d="M829 350 V403" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="706" y="412" width="250" height="60" rx="10" fill="#374151" stroke="#94a3b8"/>
    <text x="831" y="438" text-anchor="middle" font-size="18">Anisette upstream</text>
    <text x="831" y="460" text-anchor="middle" font-size="14" fill="#cbd5e1">separate</text>
    <text x="594" y="515" font-size="15" fill="#cbd5e1">Recommended for new installations</text>
    <text x="40" y="579" font-size="16" fill="#cbd5e1">Both need your Apple/Google account setup. Neither requires MQTT or Traccar.</text>
  </g>
</svg>
