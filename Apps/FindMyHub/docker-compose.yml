  title:
    en_US: Find My Hub
    it_IT: Find My Hub
  tagline:
    en_US: One map for Apple Find My and Google Find Hub trackers.
    it_IT: Una sola mappa per i tracker Apple Find My e Google Find Hub.
  description:
    en_US: |
      One self-hosted workspace for the Apple Find My and Google Find Hub
      trackers you own: local location history, source comparison and isolated
      user accounts. Latest/history maps with persistent 24-hour, 7/30-day and
      custom date/time filters. Reversible views for two or more trackers,
      retaining every original identity, history and settings.

      Manage names, colors, hidden devices, order, owners and guarded key rotation.
      Generate identities before choosing to add a device. Background polling,
      optional MQTT/Home Assistant discovery and optional existing Traccar map.
      Selective JSON export, full admin backups, ESP32/Nordic flashers, portable
      downloads and optimized configured FindMyAdv library. Responsive EN/IT UI
      with illustrated bilingual guides.

      Google reliable positions use consensus, clustering and anti-teleport
      analysis, with confidence and STALE labels. Original reports remain in
      an immutable paginated archive: Optimized, Raw and Both views are available.
      Administrator parameters live in Setup; developer controls stay discreet.

      Unofficial integrations, not GPS or guaranteed live tracking. Sightings
      depend on contributing phones and provider policies. Screenshots show
      synthetic demonstration data, not personal locations.
    it_IT: |
      Un centro self-hosted per i tuoi tracker Apple Find My e Google Find Hub:
      storico locale, confronto sorgenti e account separati. Mappa ultime/storico
      con filtri persistenti 24 ore, 7/30 giorni e date/ore personalizzate.
      Viste reversibili per due o più tracker senza fondere identità o cronologie.

      Nomi, colori, nascosti, ordine, proprietari e cambio chiavi protetto.
      Genera le identità prima di scegliere se creare un dispositivo.
      Polling server, MQTT/Home Assistant e Traccar esistente opzionali.
      Export JSON, backup admin completo, flasher ESP32/Nordic, download portatili
      e libreria FindMyAdv configurata e ottimizzata. UI EN/IT e guide illustrate.

      Le posizioni Google affidabili usano consenso, cluster e analisi anti-teleport,
      con confidence e STALE. I report originali restano in un archivio immutabile
      paginato, con viste Ottimizzati, Raw ed Entrambi. Parametri admin in Setup;
      controlli sviluppatore discreti in fondo al pannello.

      Integrazioni non ufficiali: non è GPS né tracking live garantito.
      Gli avvistamenti dipendono dai telefoni contribuenti e dai provider.
      Le immagini mostrano dati sintetici, non posizioni personali.
  tips:
    before_install:
      en_US: |
        This application uses unofficial reverse-engineered integrations and is
        not affiliated with Apple or Google. Use dedicated accounts and only
        trackers you own. Apple onboarding requires SMS 2FA. Google onboarding
        requires a secrets.json generated with the upstream desktop login flow.
        Optional local API tokens can be configured from the app settings.
      it_IT: |
        Questa applicazione usa integrazioni non ufficiali ottenute tramite
        reverse engineering e non è affiliata con Apple o Google. Usa account
        dedicati e soltanto tracker di tua proprietà. Apple richiede la 2FA via
        SMS; Google richiede un secrets.json generato con il login desktop del
        progetto upstream. I token API locali sono facoltativi e configurabili
        dalle impostazioni dell'app.
  port_map: "8125"
  scheme: http
  index: /
  version: "1.1.19"
  update_at: "2026-10-08"
  release_notes:
    en_US: "Compact Google Reports with safer device/page switching: clear stale data, disable export while loading, ignore late replies and offer Retry on errors. EN/IT guides and gallery synchronized. Keys, firmware, providers and location algorithm unchanged."
    it_IT: "Report Google compatti e cambio dispositivo/pagina sicuro: dati precedenti rimossi durante il caricamento, export disabilitato, risposte obsolete ignorate e pulsante Riprova. Guide EN/IT e galleria sincronizzate. Chiavi, firmware, provider e algoritmo invariati."
