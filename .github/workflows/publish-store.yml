name: Publish Docker App Catalog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-docker-app-catalog
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build ZimaOS protocol v2 catalog
        uses: IceWhaleTech/build-appstore-action@8e65e790b4e6da62dc0605e259b9219dd548a2ac # v1
        with:
          source: .
          output: dist
          base-url: https://cdn.jsdelivr.net/gh/Mattboxx/Find_My_Hub_Docker_Appstores@gh-pages
          cache-file: .cache/build_appstore/image-size-cache.json
          digest-cache-file: .cache/build_appstore/image-digest-cache.json
          report-json: out/build-v2-report.json
          report-title: Find My Hub ZimaOS V2 Catalog

      - name: Verify published catalog payload
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(python3 -c 'import json; print(json.load(open("adapters/runtipi/apps/find-my-hub/config.json", encoding="utf-8"))["version"])')"
          test -s dist/store.json
          test -s dist/store.it_IT.json
          test -s dist/index.json
          test -s dist/index.it_IT.json
          test -s dist/metadata.sha256
          test -s dist/metadata.tar.gz
          python -m json.tool dist/store.json >/dev/null
          python -m json.tool dist/store.it_IT.json >/dev/null
          python -m json.tool dist/index.json >/dev/null
          python -m json.tool dist/index.it_IT.json >/dev/null

          python3 scripts/validate_catalog_compose.py "$expected_version" \
            dist/apps/io.github.mattbox03.findmyhub/docker-compose.yml \
            dist/apps/io.github.mattbox03.findmyhub/docker-compose.amd64.yml \
            dist/apps/io.github.mattbox03.findmyhub/docker-compose.arm64.yml
          touch dist/.nojekyll

      - name: Upload catalog artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: find-my-hub-docker-app-catalog
          path: dist
          if-no-files-found: error

      - name: Publish catalog to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true

      - name: Refresh CDN files
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            store.json \
            store.it_IT.json \
            index.json \
            index.it_IT.json \
            metadata.sha256 \
            metadata.tar.gz \
            apps/io.github.mattbox03.findmyhub/meta.json \
            apps/io.github.mattbox03.findmyhub/meta.it_IT.json \
            apps/io.github.mattbox03.findmyhub/docker-compose.yml \
            apps/io.github.mattbox03.findmyhub/docker-compose.amd64.yml \
            apps/io.github.mattbox03.findmyhub/docker-compose.arm64.yml
          do
            curl --fail --silent --show-error \
              "https://purge.jsdelivr.net/gh/Mattboxx/Find_My_Hub_Docker_Appstores@gh-pages/${path}" \
              >/dev/null
          done

      - name: Verify CDN exposes the published app version
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(python3 -c 'import json; print(json.load(open("adapters/runtipi/apps/find-my-hub/config.json", encoding="utf-8"))["version"])')"
          for attempt in 1 2 3 4 5 6
          do
            rm -rf cdn-verify
            mkdir -p cdn-verify
            verification_ok=true

            if ! published_version="$(curl --fail --silent --show-error \
              "https://cdn.jsdelivr.net/gh/Mattboxx/Find_My_Hub_Docker_Appstores@gh-pages/apps/io.github.mattbox03.findmyhub/meta.json" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"; then
              verification_ok=false
              published_version="unavailable"
            elif [ "$published_version" != "$expected_version" ]; then
              verification_ok=false
            fi

            for compose_name in docker-compose.yml docker-compose.amd64.yml docker-compose.arm64.yml
            do
              compose_file="cdn-verify/${compose_name}"
              if ! curl --fail --silent --show-error \
                "https://cdn.jsdelivr.net/gh/Mattboxx/Find_My_Hub_Docker_Appstores@gh-pages/apps/io.github.mattbox03.findmyhub/${compose_name}" \
                --output "$compose_file"; then
                verification_ok=false
                continue
              fi
              if ! python3 scripts/validate_catalog_compose.py "$expected_version" "$compose_file"; then
                verification_ok=false
              fi
            done

            if [ "$verification_ok" = true ]; then
              echo "CDN exposes Find My Hub ${published_version} in metadata and every Compose variant"
              exit 0
            fi
            echo "CDN payload is not consistently at ${expected_version} (metadata: ${published_version}); retrying"
            sleep $((attempt * 5))
          done
          echo "CDN did not expose a consistent Find My Hub ${expected_version} payload after refresh" >&2
          exit 1
