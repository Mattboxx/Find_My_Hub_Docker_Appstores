name: Publish Docker App Catalog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-docker-app-catalog
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build ZimaOS protocol v2 catalog
        uses: IceWhaleTech/build-appstore-action@8e65e790b4e6da62dc0605e259b9219dd548a2ac # v1
        with:
          source: .
          output: dist
          base-url: https://cdn.jsdelivr.net/gh/Mattboxx/Find_My_Hub_Docker_Appstores@gh-pages
          cache-file: .cache/build_appstore/image-size-cache.json
          digest-cache-file: .cache/build_appstore/image-digest-cache.json
          report-json: out/build-v2-report.json
          report-title: Find My Hub ZimaOS V2 Catalog

      - name: Build legacy CasaOS and ZimaOS ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/store
          zip -q -r dist/store/main.zip \
            Apps \
            category-list.json \
            featured-apps.json \
            recommend-list.json \
            store-config.json \
            supported-languages.json
          touch dist/.nojekyll

      - name: Verify published catalog payload
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/store.json
          test -s dist/index.json
          test -s dist/store/main.zip
          python -m json.tool dist/store.json >/dev/null
          python -m json.tool dist/index.json >/dev/null
          unzip -t dist/store/main.zip >/dev/null

      - name: Upload catalog artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: find-my-hub-docker-app-catalog
          path: dist
          if-no-files-found: error

      - name: Publish catalog to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true

      - name: Refresh CDN files
        shell: bash
        run: |
          curl -fsSL "https://purge.jsdelivr.net/gh/Mattboxx/Find_My_Hub_Docker_Appstores@gh-pages/store.json" || true
          curl -fsSL "https://purge.jsdelivr.net/gh/Mattboxx/Find_My_Hub_Docker_Appstores@gh-pages/index.json" || true
          curl -fsSL "https://purge.jsdelivr.net/gh/Mattboxx/Find_My_Hub_Docker_Appstores@gh-pages/store/main.zip" || true
